<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kleiderschrank</title>
  <meta name="description" content="Kleidung fotografieren und Outfits nach Wetter, Anlass und Farbe planen.">
  <meta name="theme-color" content="#F4F1EC" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0F0F12" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Kleiderschrank">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- Icon-Set: einheitliche Linien-Icons statt Emojis in der Bedienung -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-hanger" viewBox="0 0 24 24"><path d="M12 7.5V7a2 2 0 1 0-2-2"/><path d="M12 7.5 3.4 14.6A1.4 1.4 0 0 0 4.3 17h15.4a1.4 1.4 0 0 0 .9-2.4z"/></symbol>
      <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M11 3.5l1.9 5 5 1.9-5 1.9-1.9 5-1.9-5-5-1.9 5-1.9z"/><path d="M18.5 15.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/></symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></symbol>
      <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7.5-4.4-7.5-10A4.3 4.3 0 0 1 12 7.4 4.3 4.3 0 0 1 19.5 10c0 5.6-7.5 10-7.5 10z"/></symbol>
      <symbol id="i-heart-fill" viewBox="0 0 24 24"><path fill="currentColor" d="M12 20s-7.5-4.4-7.5-10A4.3 4.3 0 0 1 12 7.4 4.3 4.3 0 0 1 19.5 10c0 5.6-7.5 10-7.5 10z"/></symbol>
      <symbol id="i-person" viewBox="0 0 24 24"><circle cx="12" cy="7" r="3.2"/><path d="M5.5 20.5v-1.5a6.5 6.5 0 0 1 13 0v1.5"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M19.5 10.5a7.8 7.8 0 0 0-14.2-3.8M4.5 3.8v3.7h3.7"/><path d="M4.5 13.5a7.8 7.8 0 0 0 14.2 3.8M19.5 20.2v-3.7h-3.7"/></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></symbol>
      <symbol id="i-unlock" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 7.7-1.5"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
      <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="M9.5 5.5 16 12l-6.5 6.5"/></symbol>
      <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="M14.5 5.5 8 12l6.5 6.5"/></symbol>
      <symbol id="i-chevron-up" viewBox="0 0 24 24"><path d="M5.5 15 12 8.5l6.5 6.5"/></symbol>

      <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.8l1.4-2h4.6l1.4 2h1.8A2.5 2.5 0 0 1 20 8.5v9a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 17.5z"/><circle cx="12" cy="13" r="3.5"/></symbol>
      <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M3.5 7h3.2c2 0 3.2 1 4.3 2.8l2 3.4c1.1 1.8 2.3 2.8 4.3 2.8h3.2M17.5 13.5l3 2.5-3 2.5M3.5 17h3.2c1.3 0 2.2-.4 3-1.2M14 8.2c.8-.8 1.7-1.2 3-1.2h3.5M17.5 4.5l3 2.5-3 2.5"/></symbol>

      <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M4 11V9.5A3.5 3.5 0 0 1 7.5 6H19M16 3l3 3-3 3M20 13v1.5a3.5 3.5 0 0 1-3.5 3.5H5M8 21l-3-3 3-3"/></symbol>
      <symbol id="i-basket" viewBox="0 0 24 24"><path d="M3.5 10h17l-1.6 8.3a2 2 0 0 1-2 1.7H7.1a2 2 0 0 1-2-1.7z"/><path d="M8 10l3-5.5M16 10l-3-5.5M9 14v2.5M12 14v2.5M15 14v2.5"/></symbol>
      <symbol id="i-bike" viewBox="0 0 24 24"><circle cx="6" cy="16" r="3.5"/><circle cx="18" cy="16" r="3.5"/><path d="M6 16l4-7h5l3 7M10 9l2.5 7H6M13.5 5.5H16"/></symbol>
      <symbol id="i-wand" viewBox="0 0 24 24"><path d="M5 19 15.5 8.5M14 5l1-2 1 2 2 1-2 1-1 2-1-2-2-1zM19 11l.6 1.4 1.4.6-1.4.6-.6 1.4-.6-1.4-1.4-.6 1.4-.6z"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19.5h14"/></symbol>
      <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 7h15M9.5 7V5h5v2M6.5 7l1 12.5h9l1-12.5"/></symbol>
    </defs>
  </svg>

  <main id="main"></main>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="zoom" hidden onclick="this.hidden=true"><img alt=""></div>
  <nav class="tabbar" aria-label="Hauptnavigation">
    <button data-view="schrank" class="active"><svg class="ic" aria-hidden="true"><use href="#i-hanger"></use></svg><span>Schrank</span></button>
    <button data-view="outfit"><svg class="ic" aria-hidden="true"><use href="#i-sparkle"></use></svg><span>Heute</span></button>
    <button data-view="woche"><svg class="ic" aria-hidden="true"><use href="#i-calendar"></use></svg><span>Woche</span></button>
    <button data-view="einstellungen"><svg class="ic" aria-hidden="true"><use href="#i-settings"></use></svg><span>Einstellungen</span></button>
  </nav>
  <script type="module" src="js/app.js"></script>
</body>
</html>
